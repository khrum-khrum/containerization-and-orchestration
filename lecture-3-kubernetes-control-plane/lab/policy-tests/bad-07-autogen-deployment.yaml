apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-autogen
  namespace: lab-3
  labels:
    app.kubernetes.io/name: bad-autogen
    app.kubernetes.io/part-of: shop
    owner: egor
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: bad-autogen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bad-autogen
        app.kubernetes.io/part-of: shop
        owner: egor
    spec:
      containers:
        - name: api
          image: registry.local/shop/api:0.1.0
          # resources отсутствуют: ждём отказ от autogen-варианта
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
