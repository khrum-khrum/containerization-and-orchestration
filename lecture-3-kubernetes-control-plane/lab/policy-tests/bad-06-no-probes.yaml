# Ломает require-health-probes: liveness есть, readiness нет.
apiVersion: v1
kind: Pod
metadata:
  name: bad-no-probes
  namespace: lab-3
  labels:
    app.kubernetes.io/name: bad-no-probes
    app.kubernetes.io/part-of: shop
    owner: egor
spec:
  containers:
    - name: api
      image: registry.local/shop/api:0.1.0
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
      livenessProbe:
        httpGet: { path: /health, port: 8080 }
