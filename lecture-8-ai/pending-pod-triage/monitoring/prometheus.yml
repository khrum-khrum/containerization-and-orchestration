global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: n8n
    static_configs:
      - targets: ["n8n:5678"]

  - job_name: mcp-kubernetes
    static_configs:
      - targets: ["mcp-kubernetes:9090"]

  - job_name: deps
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://mcp-filesystem:8000/healthz"]
        labels:
          dep: mcp-filesystem
      - targets: ["http://host.docker.internal:11434/api/tags"]
        labels:
          dep: ollama
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
