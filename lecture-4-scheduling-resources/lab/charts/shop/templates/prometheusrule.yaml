{{- if and .Values.monitoring.enabled .Values.monitoring.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: shop
    owner: {{ .Values.owner }}
spec:
  groups:
    - name: shop.critical-path
      rules:
        - alert: ShopOrderLatencySLOBreach
          expr: |-
            histogram_quantile(0.95,
              sum by (le) (rate(http_request_duration_seconds_bucket{namespace="{{ .Release.Namespace }}", job="{{ .Release.Name }}-api", method="POST", route="/order"}[5m]))
            ) > {{ .Values.monitoring.sla.orderP95Seconds }}
          for: 5m
          labels:
            severity: critical
            service: shop
          annotations:
            summary: "p95 POST /order выше {{ .Values.monitoring.sla.orderP95Seconds }}s"
            description: >-
              95-й перцентиль оформления заказа {{ "{{ $value | humanizeDuration }}" }}
              при SLA {{ .Values.monitoring.sla.orderP95Seconds }}s. Проверить на дашборде shop: throttling api,
              рестарты и вытеснения подов api/postgres.

        - alert: ShopCriticalPathPending
          expr: |-
            sum by (pod) (kube_pod_status_phase{namespace="{{ .Release.Namespace }}", phase="Pending", pod=~"{{ .Release.Name }}-(api|postgres)-.*"}) > 0
          for: 2m
          labels:
            severity: critical
            service: shop
          annotations:
            summary: "{{ "{{ $labels.pod }}" }} не планируется"
            description: >-
              Под критического пути две минуты в Pending: preemption не нашла
              жертв с меньшим приоритетом. Смотреть: kubectl -n {{ .Release.Namespace }}
              describe pod {{ "{{ $labels.pod }}" }} (события FailedScheduling).

        - alert: ShopNodeMemoryPressure
          expr: |-
            max by (node) (kube_node_status_condition{condition="MemoryPressure", status="true"}) == 1
          for: 1m
          labels:
            severity: warning
            service: shop
          annotations:
            summary: "MemoryPressure на узле {{ "{{ $labels.node }}" }}"
            description: >-
              memory.available на узле ниже порога eviction-hard, kubelet
              вытесняет поды. Проверить, кто съел память:
              kubectl get events -A --field-selector reason=Evicted
{{- end }}
