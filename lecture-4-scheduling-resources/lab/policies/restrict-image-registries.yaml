apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Образы только из доверенного registry
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Образ - это исполняемый код, который узел скачивает и запускает. 
spec:
  background: true
  rules:
    - name: check-registry
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        failureAction: Enforce
        message: >-
          Образ не из доверенного registry. Разрешены registry.local/shop/*
          и ghcr.io/cloudnative-pg/*, а под просит:
          {{ request.object.spec.containers[].image | join(', ', @) }}.
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                all:
                  - key: "{{ element.image }}"
                    operator: AnyNotIn
                    value:
                      - "registry.local/shop/*"
                      - "ghcr.io/cloudnative-pg/*"
