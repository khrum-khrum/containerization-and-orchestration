apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-explicit-image-tag
  annotations:
    policies.kyverno.io/title: Явный тег образа, не latest
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      latest и тег по умолчанию делают разные поды одного
      Deployment разными сборками, а revision в истории Helm перестаёт
      что-либо означать. 
spec:
  background: true
  rules:
    - name: check-tag-present
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        failureAction: Enforce
        message: >-
          У образа должен быть явный тег: image:tag или image@sha256:digest.
        pattern:
          spec:
            containers:
              - image: "*:*"

    - name: check-tag-not-latest
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        failureAction: Enforce
        message: >-
          Тег latest запрещён: он не воспроизводим и ломает rollback.
        pattern:
          spec:
            containers:
              - image: "!*:latest"
