apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-workload-labels
  annotations:
    policies.kyverno.io/title: Обязательные метки на рабочей нагрузке
    policies.kyverno.io/category: Governance
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Каждый под обязан назвать себя и своего владельца. 
spec:
  background: true
  rules:
    - name: check-required-labels
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        failureAction: Enforce
        message: >-
          Поду нужны метки app.kubernetes.io/name, app.kubernetes.io/part-of и owner.
        pattern:
          metadata:
            labels:
              app.kubernetes.io/name: "?*"
              app.kubernetes.io/part-of: "?*"
              owner: "?*"
