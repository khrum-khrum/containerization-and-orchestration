apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-health-probes
  annotations:
    policies.kyverno.io/title: Обязательные readiness и liveness probes
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Без readiness Service начинает слать трафик в под, который
      ещё не готов, и rolling update физически не может застрять на плохой
      версии.
spec:
  background: true
  rules:
    - name: check-probes
      match:
        any:
          - resources:
              kinds:
                - Pod
      preconditions:
        all:
          - key: "{{ request.object.spec.restartPolicy || 'Always' }}"
            operator: Equals
            value: Always
      validate:
        failureAction: Enforce
        message: >-
          Контейнеру нужны и readinessProbe, и livenessProbe.
        foreach:
          - list: "request.object.spec.containers[]"
            deny:
              conditions:
                any:
                  - key: readinessProbe
                    operator: AllNotIn
                    value: "{{ element.keys(@) }}"
                  - key: livenessProbe
                    operator: AllNotIn
                    value: "{{ element.keys(@) }}"
